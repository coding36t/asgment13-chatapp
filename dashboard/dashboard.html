<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Dashboard</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="vh-100 d-flex flex-column overflow-hidden">

  <!-- 9. Top Navbar -->
  <nav class="navbar navbar-dark bg-dark px-3 border-bottom">
    <span class="navbar-brand mb-0 h1" id="current-user-name">Loading...</span>
    <button id="logout-btn" class="btn btn-outline-danger btn-sm">Logout</button>
  </nav>

  <!-- Main Chat Container -->
  <div class="container-fluid flex-grow-1 overflow-hidden">
    <div class="row h-100">

      <!-- 1. Left Sidebar: Users List -->
      <div class="col-4 col-md-3 border-end bg-light p-0 d-flex flex-column h-100">
        <div class="p-3 border-bottom fw-bold bg-white">Users</div>
        <div class="list-group list-group-flush overflow-auto" id="users-list">
          <button type="button" class="list-group-item list-group-item-action active">Ali Khan</button>
          <button type="button" class="list-group-item list-group-item-action">Sara Ahmed</button>
        </div>
      </div>

      <!-- 8. Right Side: Chat User Interface -->
      <div class="col-8 col-md-9 p-0 d-flex flex-column h-100 bg-white">

        <!-- Chat Header: 6. User Name & 7. Status -->
        <div class="p-3 border-bottom bg-light d-flex justify-content-between align-items-center">
          <h5 class="mb-0" id="chat-user-name">Ali Khan</h5>
          <span class="badge bg-success" id="chat-user-status">Online</span>
        </div>

        <!-- Messages Area -->
        <div class="flex-grow-1 p-3 overflow-auto d-flex flex-column gap-3" id="chat-messages">
          <!-- 5. Friend's Message -->
          <div class="align-self-start" style="max-width: 70%;">
            <div class="border rounded p-2 bg-light">
              <p class="mb-1">Assalam-o-Alaikum! Kaise hain aap?</p>
              <div class="d-flex justify-content-between text-muted small gap-3">
                <span>Ali Khan</span>
                <span>10:30 AM</span>
              </div>
            </div>
          </div>

          <!-- 4. My Sent Message -->
          <div class="align-self-end" style="max-width: 70%;">
            <div class="border rounded p-2 bg-primary text-white">
              <p class="mb-1">Walaikum Assalam! Main bilkul theek hoon.</p>
              <div class="text-end small text-white-50">
                <span>10:31 AM</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Bottom Input Area: 2 & 3 -->
        <div class="p-2 border-top bg-light">
          <form id="message-form" class="input-group">
            <input type="text" id="message-input" class="form-control" placeholder="Type a message..." required />
            <button class="btn btn-primary px-4" type="submit" id="send-btn">Send</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="../firebase.config.js"></script>
  <script type="module" src="../index.js"></script>
  <script type="module" src="./dashboard.js"></script>
</body>
</html>
