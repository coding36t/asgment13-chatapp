<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Chat App</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">Sign In</h3>
    <form id="login-form">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" id="login-email" class="form-control" placeholder="Enter email" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="Enter password" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>
    <p class="text-center mt-3 mb-0">
      Don't have an account? <a href="../signup/signup.html">Sign Up</a>
    </p>
  </div>

  <script type="module" src="../firebase.config.js"></script>
  <script type="module" src="../index.js"></script>
</body>
</html>
